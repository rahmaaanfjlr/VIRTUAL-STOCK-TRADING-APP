<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Signup — StockSim</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Get ₹1,00,000 in virtual starting cash</p>
    </div>
    <form id="signup-form" onsubmit="signupUser(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Password (Min. 6 characters)</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary auth-btn">Sign Up</button>
    </form>
    <div class="auth-footer">
      Already have an account? <a href="login.html">Log In</a> | <a href="index.html">Home</a>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
