<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login — StockSim</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome Back</h1>
      <p>Log in to access your trading portfolio</p>
    </div>
    <form id="login-form" onsubmit="loginUser(event)">
      <div class="form-group">
        <label>Username or Email</label>
        <input type="text" id="identifier" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary auth-btn">Log In</button>
    </form>
    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign Up</a> | <a href="index.html">Home</a>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
