<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — StockSim</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>
      <div class="content-body">
        <div class="panel" style="max-width: 600px;">
          <h2>User Profile</h2>
          <div style="display:flex; flex-direction:column; gap:16px; margin-top:20px;">
            <div>Username: <strong id="profile-username">-</strong></div>
            <div>Email: <strong id="profile-email">-</strong></div>
            <div>Account Created: <strong id="profile-created">-</strong></div>
            <div>Starting Virtual Balance: <strong>₹1,00,000</strong></div>
            <div>Current Virtual Balance: <strong id="profile-balance">-</strong></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/user.js"></script>
  <script>
    renderLayout('profile');
    loadUserProfile();
  </script>
</body>
</html>
