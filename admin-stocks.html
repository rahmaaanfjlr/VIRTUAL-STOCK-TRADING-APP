<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Stocks — Admin Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>
      <div class="content-body">
        <div class="panel-header" style="margin-bottom:20px;">
          <h2>Stock Management</h2>
          <button class="btn btn-primary" onclick="openAddStockModal()">Add New Stock</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Company & Symbol</th>
              <th>Price</th>
              <th>Change</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-stocks-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Stock Modal -->
  <div id="stock-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="stock-modal-title">Add Stock</h2>
        <button class="close-btn" onclick="closeModals()">&times;</button>
      </div>
      <form id="stock-form" onsubmit="saveStock(event)" style="display:flex; flex-direction:column; gap:14px;">
        <div class="form-group" style="margin-bottom:0;">
          <label>Company Name</label>
          <input type="text" id="stock-name" class="form-control" required>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label>Symbol</label>
          <input type="text" id="stock-symbol" class="form-control" required>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label>Price</label>
          <input type="number" step="0.01" id="stock-price" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Stock</button>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/market.js"></script>
  <script>
    renderLayout('admin-stocks');
    renderAdminStocks();
  </script>
</body>
</html>
