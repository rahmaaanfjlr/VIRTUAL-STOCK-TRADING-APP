<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — StockSim</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>
      <div class="content-body">
        <div class="card-grid">
          <div class="stat-card">
            <h3>Virtual Wallet Balance</h3>
            <div class="value" id="dash-balance">₹0</div>
          </div>
          <div class="stat-card">
            <h3>Portfolio Value</h3>
            <div class="value" id="dash-portfolio-val">₹0</div>
          </div>
          <div class="stat-card">
            <h3>Total Investment</h3>
            <div class="value" id="dash-investment">₹0</div>
          </div>
          <div class="stat-card">
            <h3>Total Profit/Loss</h3>
            <div class="value" id="dash-pl">₹0</div>
          </div>
          <div class="stat-card">
            <h3>Holdings Count</h3>
            <div class="value" id="dash-holdings">0</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Recent Transactions</h2>
            <a href="transactions.html" class="btn btn-outline" style="padding:6px 12px; font-size:0.8rem;">View All</a>
          </div>
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Symbol</th>
                <th>Quantity</th>
                <th>Total Amount</th>
              </tr>
            </thead>
            <tbody id="recent-transactions-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/user.js"></script>
  <script>
    renderLayout('dashboard');
    loadDashboard();
  </script>
</body>
</html>
