<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — StockSim</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="topbar-container"></div>
      <div class="content-body">
        <div class="card-grid">
          <div class="stat-card">
            <h3>Registered Users</h3>
            <div class="value" id="admin-users-count">0</div>
          </div>
          <div class="stat-card">
            <h3>Total Transactions</h3>
            <div class="value" id="admin-tx-count">0</div>
          </div>
          <div class="stat-card">
            <h3>Money in Circulation</h3>
            <div class="value" id="admin-money-circ">₹0</div>
          </div>
          <div class="stat-card">
            <h3>Listed Stocks</h3>
            <div class="value" id="admin-stocks-count">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    renderLayout('admin-dashboard');
    renderAdminDashboard();
  </script>
</body>
</html>
