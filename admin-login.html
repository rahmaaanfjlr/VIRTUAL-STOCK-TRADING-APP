<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — StockSim</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Admin Portal</h1>
      <p>Academic Demonstration Access</p>
    </div>
    <form onsubmit="loginAdmin(event)">
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" id="adminUser" class="form-control" value="admin" required>
      </div>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="adminPass" class="form-control" value="admin123" required>
      </div>
      <button type="submit" class="btn btn-danger auth-btn">Admin Login</button>
    </form>
    <div class="auth-footer">
      <a href="index.html">Back to Home</a>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
